name: Python source validation
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check all tracked Python files compile
        run: |
          python - <<'PY'
          import pathlib, py_compile, subprocess
          paths = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          for item in paths:
              py_compile.compile(item, doraise=True)
          print(f"Compiled {len(paths)} Python files")
          PY
      - name: Reject unresolved conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |=======$|>>>>>>> )' -- '*.py'; then
            echo "Unresolved merge markers found" >&2
            exit 1
          fi
